name: Quartz source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  safe-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B scripts/audit_publish.py --history
      - run: python -B scripts/check_gui_javascript.py
      - run: python -B scripts/run_safe_tests.py
